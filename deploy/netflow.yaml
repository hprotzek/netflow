apiVersion: v1
kind: Namespace
metadata:
  name: netflow
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: netflow
  namespace: netflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: netflow
rules:
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netflow
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: netflow
subjects:
  - kind: ServiceAccount
    name: netflow
    namespace: netflow
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netflow
  namespace: netflow
spec:
  selector:
    matchLabels:
      app: netflow
  template:
    metadata:
      labels:
        app: netflow
        sidecar.istio.io/inject: "false"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: netflow
      tolerations:
        - operator: Exists
      containers:
        - name: netflow
          image: REPLACE_ME/netflow:0.1.0 # your registry
          ports:
            - name: metrics
              containerPort: 9090
          securityContext:
            # BPF programs are node-global, so no hostNetwork or hostPID is needed
            capabilities:
              drop: [ALL]
              add: [BPF, PERFMON]
          resources:
            requests:
              cpu: 20m
              memory: 100Mi
            limits:
              memory: 300Mi
